name: Release development fork

on:
  push:
    tags: ['fork-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CURSOR_APP_ROOT: ${{ github.workspace }}/.ci-sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
      - name: Verify tag and prepare dependencies
        run: |
          node -e "const p=require('./installer/package.json');if(process.env.GITHUB_REF_NAME!=='fork-v'+p.version)throw Error('Tag/version mismatch')"
          pnpm --dir Cursor++ install --frozen-lockfile
          npm ci --prefix installer
          npm install --prefix "$CURSOR_APP_ROOT" --package-lock=false --no-audit --no-fund @vscode/sqlite3@5.1.12-vscode
      - name: Test and build
        run: |
          pnpm --dir Cursor++ run test:server
          npm test --prefix installer
          npm run build:all --prefix installer
          npm run package:artifacts --prefix installer
      - name: Publish fork release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "Cursor++ NAS fork $GITHUB_REF_NAME" --generate-notes
